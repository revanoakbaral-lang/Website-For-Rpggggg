<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realm of Panowz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

  <header>
    <h1>⚔️ REALM OF PANOWZ</h1>
    <p>Petualangan dimulai...</p>
  </header>

  <section class="player-card">
    <h2>🧙 Hero</h2>

    <div class="stats">
      <span>Level: <b id="level">1</b></span>
      <span>💰 <b id="gold">100</b></span>
    </div>

    <div class="bar">
      <div id="hpBar" class="hp"></div>
    </div>
    <p>❤️ HP: <span id="hp">100</span>/<span id="maxHp">100</span></p>

    <div class="bar">
      <div id="mpBar" class="mp"></div>
    </div>
    <p>💧 MP: <span id="mp">50</span>/<span id="maxMp">50</span></p>
